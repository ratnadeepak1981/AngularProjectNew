<div class="space-y-4">
  <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-4">
    <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
      <span>💳 System Fee & Fine Payment Assignments</span>
      <span class="px-2 py-0.5 text-2xs font-semibold bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 rounded-md border border-blue-200 dark:border-blue-800">
        {{ displayItems().length }} Total
      </span>
    </h3>
    <button
      (click)="refresh.emit()"
      class="px-3.5 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold rounded-xl border border-slate-200 dark:border-slate-700 transition-colors cursor-pointer flex items-center gap-1.5 shadow-2xs"
    >
      <span>🔄</span> Refresh Ledger
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="displayItems()"
    [pageSize]="pageSize"
    [isLoading]="isLoading"
    [sortIconStyle]="'svg-arrows'"
    [emptyMessage]="'No fee assignments present on ledger. Click &quot;+ Assign Fee / Fine&quot; to assign a new fee.'"
    (pageChange)="pageChange.emit($event)"
    (pageSizeChange)="pageSizeChange.emit($event)"
  >
    <ng-template #cellActions let-row>
      @if (row.isPaid) {
        <span class="inline-flex items-center gap-1 text-2xs font-semibold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700">
          <span>🔒</span> Paid (Immutable [BRD Rule 9])
        </span>
      } @else {
        <button
          (click)="cancelUnpaid.emit(row)"
          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 dark:hover:bg-rose-900 text-rose-700 dark:text-rose-300 text-2xs font-semibold border border-rose-200 dark:border-rose-800 transition-colors cursor-pointer shadow-2xs"
        >
          <span>🗑️</span> Cancel Assignment
        </button>
      }
    </ng-template>
  </app-data-table>
</div>
