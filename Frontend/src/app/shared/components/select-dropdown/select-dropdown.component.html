<div class="relative w-full text-left">
  <!-- Field Label -->
  @if (label()) {
    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
      {{ label() }}
      @if (required()) {
        <span class="text-rose-500 font-bold">*</span>
      }
    </label>
  }

  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggleOpen($event)"
    class="w-full h-10 px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex items-center justify-between text-sm font-semibold hover:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer shadow-2xs"
  >
    <div class="flex items-center gap-2 truncate">
      @if (selectedOption()?.badgeClass) {
        <span [class]="'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold ' + selectedOption()?.badgeClass">
          @if (selectedOption()?.icon) {
            <span>{{ selectedOption()?.icon }}</span>
          }
          <span>{{ selectedOption()?.label }}</span>
        </span>
      } @else {
        @if (selectedOption()?.icon) {
          <span class="text-base shrink-0">{{ selectedOption()?.icon }}</span>
        } @else if (icon()) {
          <span class="text-base shrink-0">{{ icon() }}</span>
        }
        <span [ngClass]="{ 'text-slate-400 dark:text-slate-500 font-normal': !selectedOption() }">
          {{ selectedOption() ? selectedOption()?.label : placeholder() }}
        </span>
        @if (selectedOption()?.count !== undefined && selectedOption()?.count !== null) {
          <app-status-badge
            [count]="selectedOption()?.count"
            [countUnit]="selectedOption()?.countUnit || ''"
            size="sm"
          ></app-status-badge>
        }
      }
    </div>
    <span class="text-slate-400 text-xs transition-transform ml-2" [ngClass]="{ 'rotate-180': isOpen() }">▾</span>
  </button>

  <!-- Options Popover Card -->
  @if (isOpen()) {
    <div
      (click)="$event.stopPropagation()"
      class="absolute left-0 top-full mt-1.5 w-full bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-2 z-[100] max-h-64 overflow-y-auto space-y-1 text-xs animate-fade-in"
    >
      <!-- Search Input if enabled -->
      @if (isSearchEnabled()) {
        <div class="sticky top-0 z-10 pb-1.5 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800">
          <div class="relative">
            <input
              type="text"
              [ngModel]="searchTerm()"
              (ngModelChange)="onSearchInput($event)"
              placeholder="🔍 Search country or keyword..."
              class="w-full h-8 pl-3 pr-8 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 placeholder:text-slate-400"
              (click)="$event.stopPropagation()"
              autofocus
            />
            @if (searchTerm()) {
              <button
                type="button"
                (click)="searchTerm.set('')"
                class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs font-bold p-1 cursor-pointer"
              >
                ✕
              </button>
            }
          </div>
        </div>
      }

      <!-- Options List -->
      @if (filteredOptions().length === 0) {
        <div class="p-4 text-center text-slate-400 dark:text-slate-500 text-xs">
          No matches found for "{{ searchTerm() }}"
        </div>
      } @else {
        @for (opt of filteredOptions(); track opt.value) {
          <button
            type="button"
            (click)="selectOption(opt, $event)"
            class="w-full p-2.5 rounded-xl flex items-center justify-between text-left font-medium transition-colors cursor-pointer"
            [ngClass]="{
              'bg-blue-50 dark:bg-blue-950/80 text-blue-900 dark:text-blue-100 font-bold': selectedValue() === opt.value && !opt.badgeClass,
              'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800': selectedValue() !== opt.value && !opt.badgeClass,
              'bg-slate-50 dark:bg-slate-850 hover:bg-slate-100 dark:hover:bg-slate-800': opt.badgeClass
            }"
          >
            <div class="flex items-center gap-2.5 truncate">
              @if (opt.badgeClass) {
                <span [class]="'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold ' + opt.badgeClass">
                  @if (opt.icon) {
                    <span>{{ opt.icon }}</span>
                  }
                  <span>{{ opt.label }}</span>
                </span>
              } @else {
                @if (opt.icon) {
                  <span class="text-base shrink-0">{{ opt.icon }}</span>
                }
                <div class="truncate">
                  <p class="truncate text-xs font-bold text-slate-800 dark:text-slate-100">{{ opt.label }}</p>
                  @if (opt.description) {
                    <p class="text-[11px] text-slate-400 dark:text-slate-500 font-normal truncate">{{ opt.description }}</p>
                  }
                </div>
              }
            </div>

            <div class="flex items-center gap-2 shrink-0 ml-2">
              @if (opt.count !== undefined && opt.count !== null) {
                <app-status-badge
                  [count]="opt.count"
                  [countUnit]="opt.countUnit || ''"
                  size="sm"
                ></app-status-badge>
              }

              @if (selectedValue() === opt.value) {
                <span class="text-blue-600 dark:text-blue-400 font-bold text-sm">✓</span>
              }
            </div>
          </button>
        }
      }
    </div>
  }
</div>
