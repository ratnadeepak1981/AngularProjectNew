<div class="relative inline-block w-full text-left" #dropdownContainer>
  <!-- Label -->
  @if (label) {
    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
      {{ label }}
    </label>
  }

  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggleDropdown()"
    [disabled]="disabled"
    class="w-full flex items-center justify-between gap-2 px-3 py-2 text-xs font-medium bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg shadow-2xs hover:bg-slate-50 dark:hover:bg-slate-750 focus:outline-hidden focus:ring-2 focus:ring-blue-500 transition-all text-slate-700 dark:text-slate-200 disabled:opacity-50"
  >
    <span class="truncate">
      @if (selectedItems().length === 0) {
        <span class="text-slate-400">{{ placeholder }}</span>
      } @else if (selectedItems().length === options.length && options.length > 0) {
        <span class="font-bold text-blue-600 dark:text-blue-400">All Selected ({{ options.length }})</span>
      } @else {
        <span class="font-medium">{{ displayText() }}</span>
      }
    </span>

    <div class="flex items-center gap-1.5 shrink-0">
      @if (selectedItems().length > 0) {
        <span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300">
          {{ selectedItems().length }}
        </span>
      }
      <svg class="w-4 h-4 text-slate-400 transition-transform duration-200" [class.rotate-180]="isOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </button>

  <!-- Dropdown Menu -->
  @if (isOpen()) {
    <div class="absolute z-50 mt-1 w-full min-w-[220px] max-w-[320px] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl p-2 text-xs">
      <!-- Search input inside dropdown -->
      @if (showSearch) {
        <div class="mb-2">
          <input
            type="text"
            [(ngModel)]="searchQuery"
            placeholder="Search..."
            class="w-full px-2.5 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-hidden focus:ring-1 focus:ring-blue-500 text-slate-800 dark:text-slate-200"
          />
        </div>
      }

      <!-- Select All / Clear All Strip -->
      <div class="flex items-center justify-between pb-1.5 mb-1 border-b border-slate-100 dark:border-slate-700 px-1 text-[11px]">
        <button
          type="button"
          (click)="selectAll()"
          class="text-blue-600 dark:text-blue-400 hover:underline font-semibold"
        >
          Select All
        </button>
        <button
          type="button"
          (click)="clearAll()"
          class="text-slate-500 hover:text-red-500 font-medium"
        >
          Clear
        </button>
      </div>

      <!-- Options List -->
      <div class="max-h-52 overflow-y-auto space-y-0.5">
        @for (opt of filteredOptions(); track opt.id) {
          <label
            class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/60 cursor-pointer select-none transition-colors"
            [class.bg-blue-50]="isSelected(opt.id)"
            [class.dark:bg-blue-900/20]="isSelected(opt.id)"
          >
            <input
              type="checkbox"
              [checked]="isSelected(opt.id)"
              (change)="toggleOption(opt.id)"
              class="rounded border-slate-300 dark:border-slate-600 text-blue-600 focus:ring-blue-500 h-3.5 w-3.5"
            />
            <span class="flex-1 truncate text-slate-700 dark:text-slate-300 font-medium">
              {{ opt.label }}
            </span>
            @if (opt.count !== undefined) {
              <span class="text-[10px] text-slate-400 font-bold">({{ opt.count }})</span>
            }
          </label>
        } @empty {
          <div class="p-2 text-center text-slate-400 text-xs">No options found</div>
        }
      </div>
    </div>
  }
</div>
