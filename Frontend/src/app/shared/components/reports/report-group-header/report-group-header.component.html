<div
  class="report-group-header flex items-center justify-between px-3.5 py-2.5 bg-slate-100 dark:bg-slate-800/90 border-y-2 border-slate-300 dark:border-slate-700 select-none cursor-pointer transition-colors hover:bg-slate-200/80 dark:hover:bg-slate-750"
  (click)="toggle.emit()"
>
  <!-- Group Title & Expand Icon -->
  <div class="flex items-center gap-2.5">
    <span class="text-xs font-black text-blue-900 dark:text-blue-400">
      {{ isExpanded ? '▼' : '►' }}
    </span>
    <div class="flex items-center gap-2">
      <span class="text-xs font-black tracking-wide uppercase text-slate-800 dark:text-slate-100">
        {{ title }}
      </span>
      @if (badge) {
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 dark:bg-blue-900/50 text-blue-800 dark:text-blue-300">
          {{ badge }}
        </span>
      }
    </div>
  </div>

  <!-- Group Summary Metrics / Count -->
  <div class="flex items-center gap-4 text-xs font-semibold text-slate-600 dark:text-slate-300">
    @if (submetrics.length > 0) {
      @for (m of submetrics; track m.label) {
        <div class="flex items-center gap-1">
          <span class="text-slate-400 font-normal">{{ m.label }}:</span>
          <span class="font-bold text-slate-800 dark:text-slate-100">{{ m.value }}</span>
        </div>
      }
    }
    @if (count !== undefined) {
      <div class="font-bold text-slate-800 dark:text-slate-100">
        Total: <span class="text-blue-600 dark:text-blue-400 font-extrabold">{{ count }}</span>
      </div>
    }
  </div>
</div>
