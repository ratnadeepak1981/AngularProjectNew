<div class="report-group-footer flex flex-wrap items-center justify-between px-3.5 py-2 bg-slate-50 dark:bg-slate-850 border-b-2 border-slate-300 dark:border-slate-700 text-xs select-none">
  <!-- Subtotal Label -->
  <div class="font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
    <span class="text-blue-600 dark:text-blue-400">▲</span>
    <span>{{ label || 'Group Subtotal' }}:</span>
  </div>

  <!-- Subtotal Metric Chips -->
  <div class="flex flex-wrap items-center gap-4">
    @for (item of subtotals; track item.label) {
      <div class="flex items-center gap-1">
        <span class="text-slate-500 dark:text-slate-400 font-medium">{{ item.label }}:</span>
        <span class="font-bold text-slate-900 dark:text-white">
          {{ item.isCurrency ? (item.value | number:'1.2-2') : item.value }}
        </span>
      </div>
    }
  </div>
</div>
